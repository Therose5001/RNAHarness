[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rnaharness"
version = "0.1.0"
description = "RNA research harness: MCP tools + gateway + OpenHarness kernel"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
]

[project.scripts]
lab-mcp = "rnaharness.servers.lab_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["rnaharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a running local worker or external service"]
